name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository
        run: ./scripts/validate.sh
      - name: Check pstack version bump
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-plugin-version.py --base origin/${{ github.base_ref }}
